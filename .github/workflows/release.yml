name: "Release & Build Setup.exe"

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build standalone backend core (Python gerekmeden calisir)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests minecraft-launcher-lib urllib3
          pyinstaller --onefile --name cookielauncher-core --distpath backend --workpath build/pyinstaller --specpath build backend/server.py

      - name: Build Tauri App (Produces Windows Setup.exe on windows-latest)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "CookieLauncher v__VERSION__"
          releaseBody: "Modern Minecraft Launcher with 139+ versions, 3D skin viewer, Sodium optimization, and instances."
          releaseDraft: false
          prerelease: false
