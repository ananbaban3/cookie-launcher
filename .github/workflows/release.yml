name: "Release & Build Setup.exe"

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          # macOS: her mimari KENDI runner'inda derlenir; cunku PyInstaller
          # cross-compile yapamaz -> Intel DMG'nin gomulu cekirdegi de Intel
          # runner'da uretilmelidir.
          - platform: "macos-latest"      # Apple Silicon (M serisi)
            target: "aarch64-apple-darwin"
          - platform: "macos-15-intel"    # Intel Mac
            target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build standalone backend core (Python gerekmeden calisir)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests minecraft-launcher-lib urllib3 certifi
          # --collect-data certifi: kok sertifika demetini (cacert.pem) pakete
          # gomer. macOS/Windows'ta paketlenmis Python sistem CA'larini
          # goremedigi icin bu olmadan Modrinth/Mojang istekleri
          # SSLCertVerificationError ile basarisiz olup listeler bos geliyordu.
          pyinstaller --onefile --name cookielauncher-core --collect-data certifi --distpath backend --workpath build/pyinstaller --specpath build backend/server.py

      - name: Build Tauri App (Produces Windows Setup.exe on windows-latest)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "CookieLauncher v__VERSION__"
          releaseBody: |
            Açık kaynak, hafif Minecraft başlatıcı (Tauri + Python çekirdek, GPL-3.0).

            **Paketler**
            - **Windows:** Kurulum (.exe) — gömülü çekirdek sayesinde Python gerekmez
            - **Linux:** AppImage / .deb / .rpm
            - **macOS:** .dmg (Apple Silicon) ve .dmg (Intel) — *deneysel*

            > **macOS notu:** DMG paketleri imzasız ve notarize edilmemiştir (Apple Developer
            > sertifikası yok), bu yüzden Gatekeeper uyarı verebilir. Açmak için uygulamaya
            > sağ tık → **Aç** yapın ya da şu komutu çalıştırın:
            > `xattr -dr com.apple.quarantine /Applications/CookieLauncher.app`
            > macOS derlemeleri geliştirici tarafından test edilmemiştir; sorun bildirirseniz seviniriz.

            Mod kaynağı Modrinth'tir. Minecraft, Mojang Synergies AB'nin ticari markasıdır;
            bu proje Mojang/Microsoft ile bağlantılı, sponsorlu veya onaylı değildir.
          releaseDraft: false
          prerelease: false
